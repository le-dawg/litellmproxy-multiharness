litellm_settings:
  drop_params: true
  expose_router_debug_in_errors: false
  callbacks:
    - tool_choice_guard.proxy_guard
  model_alias_map:
    claude-sonnet-5[1m]: claude-sonnet-5
    claude-gpt-5[1m]: claude-gpt-5
    antigravity: antigravity-flash
    glm-5.2: glm5.2

router_settings:
  num_retries: 3
  retry_after: 3
  allowed_fails_policy:
    RateLimitError: 5
  fallbacks:
    - antigravity-flash-low: ["antigravity-remote-flash-low"]
    - antigravity-flash-medium: ["antigravity-remote-flash-medium"]
    - antigravity-flash-high: ["antigravity-remote-flash-high"]
    - antigravity-opus-4.6: ["antigravity-remote-opus-4.6"]
    - antigravity-flash: ["antigravity-remote-flash-medium"]
    - antigravity-pro: ["antigravity-remote-opus-4.6"]

model_list:
  # ------------------------------------------------------------------ #
  #  ANTIGRAVITY ACTIVE DEPLOYMENTS (Port 8788)                        #
  # ------------------------------------------------------------------ #
  - model_name: antigravity-flash-low
    litellm_params:
      model: openai/gemini-3.8-flash-low
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-flash-medium
    litellm_params:
      model: openai/gemini-3.8-flash-medium
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-flash-high
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-opus-4.6
    litellm_params:
      model: openai/claude-opus-4.6-thinking
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  # ------------------------------------------------------------------ #
  #  ANTIGRAVITY REMOTE FAILOVER DEPLOYMENTS (ZeroTier Mac Mini: 8788) #
  # ------------------------------------------------------------------ #
  - model_name: antigravity-remote-flash-low
    litellm_params:
      model: openai/gemini-3.8-flash-low
      api_base: http://10.147.17.130:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-remote-flash-medium
    litellm_params:
      model: openai/gemini-3.8-flash-medium
      api_base: http://10.147.17.130:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-remote-flash-high
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://10.147.17.130:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-remote-opus-4.6
    litellm_params:
      model: openai/claude-opus-4.6-thinking
      api_base: http://10.147.17.130:8788/v1
      api_key: sk-antigravity-local

  # Backward compatibility aliases
  - model_name: antigravity-flash
    litellm_params:
      model: openai/gemini-3.8-flash-medium
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: antigravity-pro
    litellm_params:
      model: openai/claude-opus-4.6-thinking
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  # Safety Net Defaults (Mapped to Antigravity Flash High / Low)
  - model_name: claude-gpt-5
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/gemini-3.8-flash-low
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: "claude-*"
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: gpt-5.4
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: "gpt-*"
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  - model_name: "*"
    litellm_params:
      model: openai/gemini-3.8-flash-high
      api_base: http://127.0.0.1:8788/v1
      api_key: sk-antigravity-local

  # External Provider Fallbacks
  - model_name: glm5.2
    litellm_params:
      model: openai/glm5.2
      api_base: https://api.regolo.ai/v1
      api_key: os.environ/REGOLO_API_KEY

  - model_name: qwen3.5-122b
    litellm_params:
      model: openai/qwen3.5-122b
      api_base: https://api.regolo.ai/v1
      api_key: os.environ/REGOLO_API_KEY

  # ------------------------------------------------------------------ #
  #  INACTIVE AZURE DEFINITIONS (Preserved for future revival/reference)#
  # ------------------------------------------------------------------ #
  - model_name: inactive-azure-gpt-5.4
    litellm_params:
      model: azure/gpt-5.4
      api_base: https://regent-ai-dev.cognitiveservices.azure.com
      api_version: "2025-04-01-preview"
      api_key: os.environ/AZURE_OPENAI_API_KEY
      base_model: gpt-5.4

  - model_name: inactive-azure-claude-gpt-5
    litellm_params:
      model: azure/gpt-5.4
      api_base: https://regent-ai-dev.cognitiveservices.azure.com
      api_version: "2025-04-01-preview"
      api_key: os.environ/AZURE_OPENAI_API_KEY
      base_model: gpt-5.4

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
