litellm_settings:
  drop_params: true
  expose_router_debug_in_errors: false
  callbacks:
    - tool_choice_guard.proxy_guard
  model_alias_map:
    claude-sonnet-5: claude-gpt-5
    claude-sonnet-5[1m]: claude-gpt-5
    claude-sonnet-4-6: claude-gpt-5
    claude-sonnet-4-5: claude-gpt-5
    claude-haiku-4-5-20251001: claude-gpt-5
    claude-gpt-5[1m]: claude-gpt-5
    claude-mythos-5: claude-gpt-5
    antigravity: antigravity-flash
    glm-5.2: glm5.2

router_settings:
  num_retries: 3
  retry_after: 3
  allowed_fails_policy:
    RateLimitError: 5
  model_group_alias:
    "claude-sonnet-5": "claude-gpt-5"
    "claude-sonnet-4-6": "claude-gpt-5"
    "claude-haiku-4-5-20251001": "claude-gpt-5"

model_list:
  - model_name: claude-gpt-5
    litellm_params:
      model: azure/gpt-5.4
      api_base: https://regent-ai-dev.cognitiveservices.azure.com
      api_version: "2025-04-01-preview"
      api_key: os.environ/AZURE_OPENAI_API_KEY
      base_model: gpt-5.4

  - model_name: claude-sonnet-5
    litellm_params:
      model: azure/gpt-5.4
      api_base: https://regent-ai-dev.cognitiveservices.azure.com
      api_version: "2025-04-01-preview"
      api_key: os.environ/AZURE_OPENAI_API_KEY
      base_model: gpt-5.4

  - model_name: claude-sonnet-4-6
